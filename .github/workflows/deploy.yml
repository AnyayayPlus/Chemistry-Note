name: Check and Publish Chemistry Note

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
  TCR_REPOSITORY: ${{ vars.TCR_REPOSITORY }}
  IMAGE: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}/${{ vars.TCR_NAMESPACE }}/${{ vars.TCR_REPOSITORY }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.repository_owner == 'AnyayayPlus' }}
    uses: ./.github/workflows/check.yml
    with:
      upload-build: true

  prepare-pdfs:
    needs: validate
    if: github.repository_owner == 'AnyayayPlus' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      export_all: ${{ steps.changed_pages.outputs.export_all }}
      changed_count: ${{ steps.changed_pages.outputs.changed_count }}
      deleted_count: ${{ steps.changed_pages.outputs.deleted_count }}
      has_pdf_changes: ${{ steps.changed_pages.outputs.has_pdf_changes }}
      needs_pdf_export: ${{ steps.changed_pages.outputs.needs_pdf_export }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.0.0
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Download Site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: .vitepress/dist

      - name: Detect changed pages
        id: changed_pages
        run: |
          set -euo pipefail

          node scripts/changed-pages.js --base "${{ github.event.before }}" --head "${{ github.sha }}" --out-dir .github/changed-pages

          export_all=$(cat .github/changed-pages/export-all.txt)
          changed_count=$(grep -c . .github/changed-pages/changed-pages.txt || true)
          deleted_count=$(grep -c . .github/changed-pages/deleted-pages.txt || true)

          needs_pdf_export=false
          has_pdf_changes=false
          if [ "$export_all" = "true" ] || [ "$changed_count" != "0" ]; then
            needs_pdf_export=true
            has_pdf_changes=true
          elif [ "$deleted_count" != "0" ]; then
            has_pdf_changes=true
          fi

          echo "export_all=$export_all" >> $GITHUB_OUTPUT
          echo "changed_count=$changed_count" >> $GITHUB_OUTPUT
          echo "deleted_count=$deleted_count" >> $GITHUB_OUTPUT
          echo "needs_pdf_export=$needs_pdf_export" >> $GITHUB_OUTPUT
          echo "has_pdf_changes=$has_pdf_changes" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        if: steps.changed_pages.outputs.has_pdf_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: changed-pages
          path: .github/changed-pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.repository_owner == 'AnyayayPlus' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.MIGRATION_FREEZE != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate repository variables
        shell: bash
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          for variable in TCR_NAMESPACE TCR_REPOSITORY DOKPLOY_WEBHOOK_URL; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing Actions variable or secret: $variable"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: .vitepress/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and load image
        id: build
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to Tencent TCR
        id: push
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          docker push "${IMAGE}:sha-${GITHUB_SHA}" | tee "$RUNNER_TEMP/tcr-push.log"
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/tcr-push.log" | tail -n 1)
          if [[ -z "$digest" ]]; then
            echo "::error::Push completed without a registry digest in the output"
            exit 1
          fi
          docker push "${IMAGE}:latest" | tee "$RUNNER_TEMP/tcr-latest-push.log"
          latest_digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/tcr-latest-push.log" | tail -n 1)
          if [[ "$latest_digest" != "$digest" ]]; then
            echo "::error::latest and SHA tags must resolve to the same image digest"
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment
        timeout-minutes: 2
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          umask 077
          jq -n \
            --arg image "${IMAGE}:latest" \
            --arg sha "$GITHUB_SHA" \
            '{registry_package: {package_version: {package_url: $image, container_metadata: {tag: {name: "latest"}}}}, head_commit: {id: $sha}}' \
            > "$RUNNER_TEMP/dokploy-deploy-request.json"
          # The supported registry_package payload lets Dokploy check the image and tag.
          http_code=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-github-event: registry_package" \
            --data-binary "@$RUNNER_TEMP/dokploy-deploy-request.json" \
            --output "$RUNNER_TEMP/dokploy-deploy-response.json" \
            --write-out '%{http_code}')
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Dokploy webhook rejected the request (HTTP $http_code). Check Auto Deploy and the configured image/tag."
            exit 1
          fi
          jq -e '.message == "Application deployed successfully"' "$RUNNER_TEMP/dokploy-deploy-response.json" > /dev/null
          echo "Dokploy webhook deployment request accepted. Check Deployments for the final result."

      - name: Show deployment image
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### Dokploy 部署镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy target: ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dokploy deployment requested; this confirms submission, not deployment completion." >> "$GITHUB_STEP_SUMMARY"

  export-pdfs:
    needs: prepare-pdfs
    if: needs.prepare-pdfs.outputs.has_pdf_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download changed pages
        uses: actions/download-artifact@v8
        with:
          name: changed-pages
          path: .github/changed-pages

      - name: Download Site
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: .vitepress/dist

      - name: Setup Vite+
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.0.0
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Install CJK fonts
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          sudo fc-cache -fv

      - name: Clone CNB PDF Repository
        run: |
          git clone --depth 1 https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/Seeridia/Chemistry-Note-File.git pdf-repo

      - name: Install Playwright Browsers
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        run: vp exec playwright install --with-deps chromium

      - name: Export PDFs
        if: needs.prepare-pdfs.outputs.needs_pdf_export == 'true'
        env:
          EXPORT_ALL: ${{ needs.prepare-pdfs.outputs.export_all }}
        run: |
          set -euo pipefail

          concurrency=$(( $(nproc) * 2 ))
          if [ "$EXPORT_ALL" = "true" ]; then
            PDF_USE_GOOGLE_FONT=1 node scripts/export-pdf.js --out-dir pdf-repo --concurrency "$concurrency"
          else
            PDF_USE_GOOGLE_FONT=1 node scripts/export-pdf.js --list .github/changed-pages/changed-pages.txt --out-dir pdf-repo --concurrency "$concurrency"
          fi

      - name: Remove deleted PDFs
        if: needs.prepare-pdfs.outputs.deleted_count != '0'
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            pdf="${file%.html}.pdf"
            rm -f "pdf-repo/$pdf"
          done < .github/changed-pages/deleted-pages.txt

      - name: Push PDF updates
        run: |
          cd pdf-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No PDF changes to push."
            exit 0
          fi
          git checkout --orphan temp-sync
          git add -A
          git commit -m "Sync PDFs from ${{ github.sha }}"
          git branch -M main
          git push --force origin main
