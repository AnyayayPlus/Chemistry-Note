name: Build and Publish PDFs

on:
  workflow_call:
    secrets:
      CNB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified edition to CNB
        type: boolean
        default: false
      force:
        description: Re-render every unit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview-site:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yml
    with:
      upload-build: true

  pdf:
    needs: preview-site
    if: >-
      !cancelled() &&
      (needs.preview-site.result == 'success' || needs.preview-site.result == 'skipped') &&
      github.repository_owner == 'AnyayayPlus'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: chemistry-note-pdf
      cancel-in-progress: false
    env:
      PUBLISH_PDF: ${{ vars.PDF_PUBLISH_ENABLED == 'true' && (inputs.publish || github.event_name == 'push') && github.ref == 'refs/heads/master' }}
      FORCE_PDF: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/pdf/go.mod
          cache-dependency-path: scripts/pdf/go.sum

      - name: Build PDF tool
        run: |
          go -C scripts/pdf test ./...
          go -C scripts/pdf build -o "$RUNNER_TEMP/chemistry-pdf" .

      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: .vitepress/dist

      - name: Restore rendered PDF bodies
        uses: actions/cache@v5
        with:
          path: output/pdf-bodies
          key: chemistry-pdf-bodies-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: chemistry-pdf-bodies-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Read the currently published edition
        if: env.PUBLISH_PDF == 'true'
        run: git clone --depth 1 --branch main https://cnb.cool/Seeridia/Chemistry-Note-File.git output/cnb-pdf

      - name: Install Chromium and HarfBuzz
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-bin
          vp exec playwright install --with-deps --only-shell chromium
          executable=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-headless-shell-linux64/chrome-headless-shell' -type f | sort -V | tail -n 1)
          test -x "$executable"
          echo "PDF_CHROMIUM=$executable" >> "$GITHUB_ENV"

      - name: Build and verify
        id: build
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PUBLISH_PDF" == "true" ]]; then
            args+=(--previous output/cnb-pdf)
          fi
          if [[ "$FORCE_PDF" == "true" ]]; then
            args+=(--force)
          fi
          "$RUNNER_TEMP/chemistry-pdf" build "${args[@]}"
          echo "changed=$(jq -er 'if .changed then "true" else "false" end' output/pdf/result.json)" >> "$GITHUB_OUTPUT"

      - name: Save verified PDFs
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chemistry-note-pdfs
          path: |
            output/pdf/units/
            output/pdf/pdf-manifest.json
            output/pdf/Anyayay_Chemistry_Note.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Publish to CNB
        if: env.PUBLISH_PDF == 'true'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: '"$RUNNER_TEMP/chemistry-pdf" publish output/pdf output/cnb-pdf'
