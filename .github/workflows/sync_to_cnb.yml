name: Sync to CNB

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.repository_owner == 'AnyayayPlus' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to CNB Repository
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CNB_TOKEN" ]; then
            echo "CNB_TOKEN is empty"
            exit 1
          fi

          auth_header=$(printf 'cnb:%s' "$CNB_TOKEN" | base64 | tr -d '\n')
          git remote add cnb https://cnb.cool/Seeridia/Chemistry-Note.git
          git -c http.extraHeader="Authorization: Basic $auth_header" \
            push --force cnb "HEAD:refs/heads/${GITHUB_REF_NAME}" --tags
