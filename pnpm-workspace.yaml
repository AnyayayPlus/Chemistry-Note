catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
minimumReleaseAgeExclude:
  - vitepress-inline-editor@0.1.0-beta.2
overrides:
  vite@*: "catalog:"
  "@xmldom/xmldom@<0.9.12": ^0.9.12
  # Keep the final MathJax 3 release instead of pnpm's undeprecated 3.2.1 fallback.
  mathjax-full: 3.2.2
  # Preserve mhchem subscripts inside Markdown emphasis.
  oxfmt: 0.70.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
